micronaut:
  application:
    name: jchat
  router:
    static-resources:
      default:
        enabled: true
        mapping: /**
        paths: classpath:META-INF/resources

logger:
  levels:
    io.micronaut.http.server.netty: WARN
    io.micronaut.http: WARN
    io.micronaut.context.event.ApplicationEventPublisher: WARN
    dev.ai4j.openai4j: WARN
    dev.langchain4j: WARN
    io.netty: WARN

jackson:
  serialization:
    write-dates-as-timestamps: false

app:
  system-prompt-path: system-prompt.txt
  extraction-prompt-path: extraction-prompt.txt
  search-plan-prompt-path: search-plan-prompt.txt
  search-extraction-prompt-path: search-extraction-prompt.txt
  context:
    recent-turns: 3
    default-timezone: Europe/Berlin
    default-locale: de-DE
  knowledge:
    max-statements: 1000
  retriever:
    max-statements: 20  # maximal number of statements from history into context
    min-statements: 10  # if min-turns do not deliver min-statements, then fill up until min-statements
    min-turns: 3  # from the last min-turns all statements are pushed int the context
    max-knowledge: 12 # max facts from knowledge store into context, with no relation to history
    max-search: 6 # max statements from one websearch into context
  search:
    enabled: true
    max-results: 6
    knowledge-store-first: true
  agent:
    enabled: true
    max-steps: 4
    max-tool-calls: 2
    max-tool-calls-per-step: 1
  tools:
    web-search:
      enabled: true
    xnsearch:
      base-url: ${XNSEARCH_URL:}
      max-pages: 5
      page-size: 10
    wikipedia:
      lang: de
      enabled: true

llm:
  default-timeout-seconds: 120
  default-max-retries: 2
  providers:
    or-free:
      type: openai
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      model-name: openrouter/free
    or-lightning:
      type: openai
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      model-name: nvidia/nemotron-3.5-lightning:free
    or-ultra:
      type: openai
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      model-name: nvidia/nemotron-3-ultra-550b-a55b:free
      timeout-seconds: 180
#    anthropic-main:
#      type: anthropic
#      api-key: ${ANTHROPIC_API_KEY}
#      model-name: claude-sonnet-4-5
#    anthropic-fast:
#      type: anthropic
#      api-key: ${ANTHROPIC_API_KEY}
#      model-name: claude-haiku-4-5
#    openai-main:
#      type: openai
#      api-key: ${OPENAI_API_KEY}
#      model-name: gpt-4o
    llama-hermes:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-p100/hermes3.1-8b
      disable-reasoning: true
      max-output-tokens: 1024
    llama-qwen35-4b:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-p100/qwen3.5-4b
    llama-agentic-coder:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-r9700/coder-agentic
    llama-agentic-reasoning:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-r9700/reasoning-agentic
      max-output-tokens: 4096
      disable-reasoning: true
      timeout-seconds: 180
      max-retries: 2

  tasks:
    chat:
      provider: llama-agentic-reasoning
    extraction:
      provider: llama-hermes
    meta:
      provider: llama-hermes
    search-plan:
      provider: llama-hermes
    search-extract:
      provider: llama-hermes
    check:
      provider: llama-hermes
    default:
      provider: llama-qwen35-4b
