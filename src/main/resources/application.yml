micronaut:
  application:
    name: jchat
  router:
    static-resources:
      default:
        enabled: true
        mapping: /**
        paths: classpath:META-INF/resources

jackson:
  serialization:
    write-dates-as-timestamps: false

app:
  system-prompt-path: system-prompt.txt
  extraction-prompt-path: extraction-prompt.txt
  search-plan-prompt-path: search-plan-prompt.txt
  search-extraction-prompt-path: search-extraction-prompt.txt
  context:
    recent-turns: 3
    default-timezone: Europe/Berlin
    default-locale: de-DE
  retriever:
    max-statements: 12
  search:
    enabled: true
    max-results: 5
    max-triples: 6
    xnsearch:
      base-url: ${XNSEARCH_URL:}
      max-pages: 5
      page-size: 10
    wikipedia:
      lang: de
      enabled: true

llm:
  default-timeout-seconds: 120
  default-max-retries: 0
  providers:
    or-free:
      type: openai
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      model-name: openrouter/free
    or-lightning:
      type: openai
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      model-name: nvidia/nemotron-3.5-lightning:free
    or-ultra:
      type: openai
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      model-name: nvidia/nemotron-3-ultra-550b-a55b:free
      timeout-seconds: 180
#    anthropic-main:
#      type: anthropic
#      api-key: ${ANTHROPIC_API_KEY}
#      model-name: claude-sonnet-4-5
#    anthropic-fast:
#      type: anthropic
#      api-key: ${ANTHROPIC_API_KEY}
#      model-name: claude-haiku-4-5
#    openai-main:
#      type: openai
#      api-key: ${OPENAI_API_KEY}
#      model-name: gpt-4o
    llama-json:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-p100/json-fast
      disable-reasoning: true
      max-output-tokens: 1024
    llama-chat-fast:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-p100/chat-main
    llama-agentic-coder:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-r9700/coder-agentic
    llama-agentic-reasoning:
      type: bifrost
      api-type: openai
      api-key: ${BIFROST_VIRTUAL_KEY}
      base-url: https://llms.am5.hergeth.cloud/v1
      model-name: llama-r9700/reasoning-agentic
      max-output-tokens: 4096


  tasks:
    chat:
      provider: llama-agentic-reasoning
    extraction:
      provider: llama-json
    meta:
      provider: llama-json
    search-plan:
      provider: llama-json
    search-extract:
      provider: llama-json
    check:
      provider: or-lightning
    default:
      provider: llama-chat-fast
