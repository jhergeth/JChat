name: LLM Evaluation (DeepEval)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DEEPEVAL_MODEL: "gpt-4o-mini"  # Modell, das als "Judge" dient
  # DEEP_EVAL_API_KEY: ${{ secrets.DEEPEVAL_API_KEY }} # Optional, für Cloud-Features

jobs:
  test:
    name: Run DeepEval Tests
    # WICHTIG: Label muss exakt mit dem im GitHub UI hinterlegten Label übereinstimmen
    runs-on: [self-hosted, linux, your-runner-label]
    
    env:
      # OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Test-Target (Lokales LLM)
      LLM_TARGET_URL: "https://llm-r9700.am5.hergeth.cloud:8081/v1"

    steps:
      - uses: actions/checkout@v4

      # 1. Python einrichten MIT Cache
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Achte auf deine Version!
          cache: 'pip'            # <--- WICHTIG: Aktiviert pip-Caching automatisch
          cache-dependency-path: 'llm-tests/requirements.txt' # Pfad korrigiert

      - name: Install Dependencies
        run: pip install -r llm-tests/requirements.txt

      - name: Run DeepEval Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest llm-tests/ -v --tb=long --junitxml=test-results.xml
